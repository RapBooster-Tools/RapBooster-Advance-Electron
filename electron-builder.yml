appId: com.rapbooster.advance
productName: RapBooster Advance
copyright: Copyright © 2026

directories:
  output: dist
  buildResources: assets/branding

# The generated Prisma client is plain TypeScript compiled into out/, but the
# migration SQL is read from disk at boot, so it must ship inside the asar.
files:
  - out/**/*
  - prisma/migrations/**/*
  - package.json
  - '!**/*.map'
  - '!**/*.ts'
  # out/renderer is produced by scripts/copy-renderer.mjs during build:renderer,
  # so out/**/* above already covers the static export. Keeping the copy in the
  # build (not here) means the unpackaged build and the packaged build share one
  # layout, and E2E exercises the same load path the shipped app uses.

# Native .node binaries cannot be dlopen'd from inside an asar archive.
# sharp is Baileys' image-thumbnail library (an optional *peer* dependency, so
# it is only packaged because we declare it ourselves — see scripts/check-media-deps.mjs).
asar: true
asarUnpack:
  - '**/node_modules/better-sqlite3/**'
  - '**/node_modules/sharp/**'
  - '**/node_modules/@img/**'

win:
  target:
    - target: nsis
      arch: [x64]
  icon: assets/branding/icon.png
  # Signing activates automatically when CSC_LINK and CSC_KEY_PASSWORD are set
  # in the build environment. Until REQUIREMENTS §4 supplies a certificate,
  # builds are unsigned and Windows will show a SmartScreen warning.
  signAndEditExecutable: true

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false

# macOS (tracker D85). zip is required alongside dmg: electron-updater installs
# Mac updates from the zip and reads latest-mac.yml. Build on a Mac — the native
# modules (better-sqlite3, sharp's @img/sharp-darwin-*) must be the darwin
# binaries for each arch; see RELEASE.md.
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  icon: assets/branding/icon.png
  category: public.app-category.business
  # No Apple Developer ID (REQUIREMENTS §4), so the app is ad-hoc signed ('-'):
  # every binary gets a valid signature after packaging. Without one, Apple
  # Silicon Macs report a downloaded build as "damaged" with no way to open it;
  # with it, users get the normal "Open Anyway" prompt in System Settings →
  # Privacy & Security. Hardened runtime is off because it is only useful for
  # notarization, and with an ad-hoc signature its library validation would
  # refuse the native modules (better-sqlite3, sharp).
  # When a Developer ID exists: set identity to it (or remove the line),
  # hardenedRuntime: true, notarize: true, and add the APPLE_* env vars.
  identity: '-'
  hardenedRuntime: false
  gatekeeperAssess: false
  notarize: false
  entitlements: assets/branding/entitlements.mac.plist
  entitlementsInherit: assets/branding/entitlements.mac.plist

# The arch is in every name: without it the Intel dmg was just "RapBooster Advance-0.1.0.dmg".
dmg:
  artifactName: RapBooster-Advance-${version}-${arch}.${ext}

linux:
  target: []

# Update feed is a placeholder until REQUIREMENTS.md §3 is filled.
publish:
  - provider: generic
    url: https://updates.example.invalid/rapbooster/
